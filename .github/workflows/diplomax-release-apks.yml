name: Diplomax Release APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROD_API_BASE_URL: https://api.diplomax.cm/v1

jobs:
  build-release-apks:
    name: Build release APK (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: student
            app_path: diplomax_cm/diplomax_student
          - app_name: university
            app_path: diplomax_cm/diplomax_university
          - app_name: recruiter
            app_path: diplomax_cm/diplomax_recruiter
    defaults:
      run:
        working-directory: ${{ matrix.app_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve production API base URL
        id: api
        shell: bash
        run: |
          if [ -n "${{ vars.PROD_API_BASE_URL }}" ]; then
            echo "value=${{ vars.PROD_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.PROD_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${{ steps.api.outputs.value }}

      - name: Package APK
        id: package
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SAFE_VERSION=${VERSION//+/-}
          TAG=${GITHUB_REF_NAME}
          FILE_NAME="diplomax-${{ matrix.app_name }}-${SAFE_VERSION}-${TAG}.apk"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/release/$FILE_NAME"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.file_name }}
          path: release/${{ steps.package.outputs.file_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-release-apks
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          NOTES_FILE=release_notes.md
          {
            echo "# Diplomax CM APK Release $GITHUB_REF_NAME"
            echo
            echo "## Included apps"
            echo "- diplomax_student"
            echo "- diplomax_university"
            echo "- diplomax_recruiter"
            echo
            echo "## API target"
            if [ -n "${{ vars.PROD_API_BASE_URL }}" ]; then
              echo "- ${{ vars.PROD_API_BASE_URL }}"
            else
              echo "- ${{ env.PROD_API_BASE_URL }}"
            fi
            echo
            echo "## APK files"
            find release-assets -type f -name '*.apk' | sed 's#release-assets/##' | sed 's#^#- #' | sort
          } > "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.apk
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
