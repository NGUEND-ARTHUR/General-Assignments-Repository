name: Diplomax Backend Image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "diplomax_cm/backend/**"
      - ".github/workflows/diplomax-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/diplomax-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: diplomax_cm/backend
          file: diplomax_cm/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-hook:
    name: Trigger backend deploy hook
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    env:
      BACKEND_DEPLOY_WEBHOOK_URL: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Call deploy webhook
        if: env.BACKEND_DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -X POST "$BACKEND_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"repository":"${{ github.repository }}","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}'

      - name: Skip deploy webhook (not configured)
        if: env.BACKEND_DEPLOY_WEBHOOK_URL == ''
        run: echo "BACKEND_DEPLOY_WEBHOOK_URL is empty; skipping deploy hook."
