name: uniattend
description: University Attendance Management System for ICT Cameroon

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.3

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  crypto: ^3.0.6

  # Location / GPS
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Device Info
  device_info_plus: ^9.1.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # Excel Export
  excel: ^4.0.2
  path_provider: ^2.1.1
  share_plus: ^7.2.1

  # PDF Export
  pdf: ^3.10.7
  printing: ^5.12.0

  # UI Utilities
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.18.1
  fl_chart: ^0.65.0

  # Biometrics
  local_auth: ^2.2.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
