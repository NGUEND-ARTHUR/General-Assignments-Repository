name: diplomax_admin
description: Diplomax System Administrator Portal - Web app for managing institutions, admins, and platform settings.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^10.0.0
  dio: ^5.3.0
  google_fonts: ^6.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  intl_utils: ^2.8.5
  jwt_decoder: ^2.0.1
  uuid: ^4.0.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
